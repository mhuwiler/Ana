# Analysis cuts — per-channel cards with named cuts.
#
# Format: key = cut name, value = C++ expression
# CUTS = ["common", "tauhtauh"]  → merges common + tauhtauh
# CUTS = []                      → no cuts
#
# Comment out a line to disable that cut.

common:
  min_jets: "nJets >= 2"
  b_coi0_score: "b_coi0_score > 0.6"
  b_coi1_score: "b_coi1_score > 0.6"

tauhtauh:
  tau_coi0_score: "tau_coi0_score > 0.3"
  tau_coi1_score: "tau_coi1_score > 0.3"
  mbb_window: "mbb_coi > 70 && mbb_coi < 150"
  mtautau_window: "mtautau_coi > 50 && mtautau_coi < 150"

taumutauh:
  tau_coi0_score: "tau_coi0_score > 0.3"
  muon_req: "nMuons >= 1"
  mbb_window: "mbb_coi > 70 && mbb_coi < 150"
  mtautau_window: "mtautau_coi > 30 && mtautau_coi < 150"

tauetauh:
  tau_coi0_score: "tau_coi0_score > 0.3"
  electron_req: "nElectrons >= 1"
  mbb_window: "mbb_coi > 70 && mbb_coi < 150"
  mtautau_window: "mtautau_coi > 30 && mtautau_coi < 150"
