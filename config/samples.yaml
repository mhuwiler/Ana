groups:

  # --------------------------------------------------------------------------
  # Signal: gg->HH->bbtautau (SM coupling point)
  #   sigma_ggHH(13.6 TeV, kl=1) = 34.30 fb  (NNLO FTapprox, LHCHWG)
  #   BR(HH->bbtautau) = 2 * 0.5824 * 0.06272 = 0.07304
  # --------------------------------------------------------------------------
