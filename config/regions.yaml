# config/regions.yaml — Analysis region definitions and gen-matching thresholds
#
# Defines the signal region cuts applied in the cutflow and histogram phases,
# plus gen-level matching parameters used in elements/GenMatching.C.
#
# Edit here — no C++ recompilation needed.

# H->bb Higgs candidate dijet pairing
# Algorithm: find the AK4 dijet pair with invariant mass inside [mass_lo, mass_hi]
# whose mass is closest to `target`. Uses Ana::findDijetInWindow() from
# HHbbtautauAnaElements.C (or future elements/GenMatching.C).
hbb:
  mass_lo:  100.0   # mass window low edge  [GeV]
  mass_hi:  150.0   # mass window high edge [GeV]
  target:   125.0   # nominal H mass: closest-pair algorithm target [GeV]

# H->tautau Higgs candidate dijet pairing (jets NOT used by H->bb candidate)
htautau:
  mass_lo:   40.0   # mass window low edge  [GeV]  (wider: tautau has more MET)
  mass_hi:  150.0   # mass window high edge [GeV]
  target:    80.0   # effective H->tautau visible mass target [GeV]

# Gen-level particle matching parameters
# Used in elements/GenMatching.C for dR-based gen-reco matching.
gen_matching:
  dr_threshold: 0.05   # maximum deltaR for a gen particle to be matched to reco
                        # (same value as matchingDrThres in HHbbtautauAnaElements.C)
